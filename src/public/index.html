<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f5">
    <meta name="description" content="CareerBridge AI turns skills evidence and sourced career trends into your next learning steps.">
    <title>CareerBridge AI | Future Skills Navigator</title>
    <style>
:root {
  --ink: #1e2d2b;
  --muted: #73817c;
  --line: #e4e9e5;
  --paper: #ffffff;
  --canvas: #f5f7f5;
  --green: #18745e;
  --green-dark: #115a49;
  --green-soft: #e7f4ee;
  --mint: #c9e5d8;
  --amber: #b87929;
  --amber-soft: #fbf1df;
  --blue: #47799a;
  --blue-soft: #eaf2f7;
  --red: #bd6658;
  --shadow: 0 12px 32px rgba(35, 65, 55, .06);
  font-family: "DM Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--canvas);
}

.field textarea { width: 100%; min-height: 74px; padding: 9px 10px; resize: vertical; outline: none; border: 1px solid #e1e7e2; border-radius: 8px; color: #394a42; background: #fff; font-size: 10px; line-height: 1.55; }
.field textarea:focus { border-color: #82b59a; box-shadow: 0 0 0 3px #e6f3eb; }
.task-review-list { display: grid; gap: 7px; }
.task-review-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid #edf0ed; border-radius: 8px; }
.task-review-row strong { color: #5e6d64; font-size: 9px; font-weight: 600; }
.task-review-row span { color: #477657; font-size: 8px; text-align: right; }

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: var(--canvas); }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
a { color: inherit; }

.app-shell { min-height: 100vh; display: flex; }
.sidebar {
  width: 248px; flex: 0 0 248px; min-height: 100vh; padding: 26px 17px 18px;
  background: #fbfcfa; border-right: 1px solid #e8ece8; display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; padding: 0 8px 31px; }
.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px 13px 13px 4px; background: var(--green); color: white; font-size: 17px; font-weight: 700; letter-spacing: -1px; }
.brand-copy { display: flex; flex-direction: column; line-height: 1.12; }
.brand-copy strong { font-size: 15px; letter-spacing: -.45px; }
.brand-copy small { margin-top: 5px; font-size: 9px; font-weight: 700; letter-spacing: 1.65px; color: #8d9b95; }
.workspace-label { padding: 0 11px 10px; color: #9aa59f; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; }
.side-nav { display: grid; gap: 5px; }
.nav-item { width: 100%; height: 44px; border: 0; background: transparent; border-radius: 11px; display: flex; align-items: center; gap: 11px; padding: 0 11px; color: #66736e; text-align: left; cursor: pointer; font-size: 13px; transition: .18s ease; }
.nav-item:hover { background: #f0f4f1; color: var(--ink); }
.nav-item.active { color: var(--green-dark); background: #eaf4ee; font-weight: 600; }
.nav-icon { width: 19px; text-align: center; color: #87958f; font-size: 18px; line-height: 1; }
.nav-item.active .nav-icon { color: var(--green); }
.nav-tag { margin-left: auto; padding: 3px 6px; border-radius: 5px; color: var(--green); background: #d8eee3; font-size: 9px; font-weight: 700; }
.sidebar-spacer { flex: 1; min-height: 40px; }
.sidebar-note { display: flex; gap: 10px; align-items: flex-start; margin: 15px 2px; padding: 13px 11px; border: 1px solid #e8ece8; border-radius: 11px; background: #fff; }
.note-dot, .demo-badge span { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 4px; background: #58a783; border-radius: 50%; box-shadow: 0 0 0 3px #e5f3eb; }
.sidebar-note div { display: grid; gap: 4px; }
.sidebar-note strong { font-size: 11px; font-weight: 600; }
.sidebar-note small { font-size: 10px; color: #89958f; }
.sidebar-footer { padding: 12px 8px 0; border-top: 1px solid #edf0ed; display: flex; justify-content: space-between; color: #a4aea8; font-size: 9px; font-weight: 700; letter-spacing: .65px; }

.main-shell { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.topbar { min-height: 93px; padding: 19px clamp(22px, 4vw, 58px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e9ede9; background: rgba(250, 251, 249, .86); }
.topbar-title h1 { margin: 4px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -.6px; }
.eyebrow { margin: 0; color: #98a39e; font-size: 9px; letter-spacing: 1.25px; font-weight: 700; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.demo-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px; color: #75837c; border: 1px solid #e7ebe7; border-radius: 999px; background: #fff; font-size: 10px; }
.demo-badge span { width: 6px; height: 6px; margin: 0; }
.button { min-height: 38px; padding: 0 15px; border: 1px solid transparent; border-radius: 9px; font-size: 11px; font-weight: 600; cursor: pointer; transition: .18s ease; }
.button:hover { transform: translateY(-1px); }
.button-primary { color: #fff; background: var(--green); box-shadow: 0 5px 12px rgba(24, 116, 94, .14); }
.button-primary:hover { background: var(--green-dark); }
.button-quiet { color: #52645c; background: #fff; border-color: #e3e9e4; }
.button-quiet:hover { border-color: #bdcec4; }
.button-link { min-height: auto; padding: 5px 0; color: var(--green); background: transparent; border: 0; font-size: 11px; font-weight: 650; cursor: pointer; }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #fff; background: #b1c9bc; font-size: 12px; font-weight: 700; cursor: pointer; }
.mobile-menu { display: none; }
.content { width: min(1360px, 100%); margin: 0 auto; padding: 30px clamp(22px, 4vw, 58px) 45px; flex: 1; outline: none; }
.app-footer { display: flex; justify-content: space-between; gap: 14px; padding: 14px clamp(22px, 4vw, 58px) 20px; color: #a0aaa4; font-size: 9px; border-top: 1px solid #e9ede9; }

.page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 21px; }
.page-intro h2 { margin: 0; font-size: 21px; line-height: 1.35; letter-spacing: -.65px; }
.page-intro p { max-width: 700px; margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.intro-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.market-picker { position: relative; width: min(380px, 100%); z-index: 12; }
.market-picker > label { display: block; margin-bottom: 6px; color: #52645c; font-size: 11px; font-weight: 650; }
.market-picker-input-wrap { position: relative; display: flex; align-items: center; }
.market-picker-input-wrap input { width: 100%; min-width: 0; height: 40px; padding: 0 39px 0 12px; border: 1px solid #dfe7e1; border-radius: 10px; outline: none; color: #34463e; background: #fff; box-shadow: 0 3px 12px rgba(35,65,55,.04); font-size: 12px; }
.market-picker-input-wrap input:focus { border-color: #80b49b; box-shadow: 0 0 0 3px #e7f4ec; }
.market-picker-input-wrap > span { position: absolute; right: 13px; color: #71827a; font-size: 19px; pointer-events: none; }
.market-picker > p { margin: 6px 0 0; color: #85928a; font-size: 9px; line-height: 1.5; }
.market-country-results { position: absolute; top: calc(100% - 1px); left: 0; width: 100%; max-height: 360px; overflow: auto; border: 1px solid #dfe7e1; border-radius: 12px; background: #fff; box-shadow: 0 15px 32px rgba(28,54,43,.14); }
.market-country-results[hidden] { display: none; }
.market-country-option { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 12px; border: 0; border-bottom: 1px solid #eff2ef; background: #fff; color: #394a42; text-align: left; cursor: pointer; }
.market-country-option:hover, .market-country-option:focus-visible { outline: none; background: #eff7f2; }
.market-country-option > span { display: grid; gap: 2px; }
.market-country-option strong { font-size: 12px; font-weight: 650; }
.market-country-option small { color: #85928a; font-size: 10px; }
.market-country-option em { flex: 0 0 auto; color: #74877b; font-size: 9px; font-style: normal; }
.market-country-group { background: #f7faf8; }
.market-country-foot, .market-country-empty { padding: 10px 12px; color: #84918a; font-size: 9px; }
.hero-card { position: relative; overflow: hidden; min-height: 238px; display: grid; grid-template-columns: 1.4fr .6fr; align-items: center; gap: 25px; padding: 30px 34px; border-radius: 17px; color: #f8fffb; background: #174c40; box-shadow: var(--shadow); }
.hero-card:before { content: ""; position: absolute; width: 380px; height: 380px; right: -72px; top: -198px; border: 1px solid rgba(207, 241, 221, .14); border-radius: 50%; box-shadow: 0 0 0 29px rgba(207, 241, 221, .035), 0 0 0 60px rgba(207, 241, 221, .025); }
.hero-card:after { content: ""; position: absolute; width: 180px; height: 180px; right: 21%; bottom: -129px; background: rgba(84, 165, 129, .12); border-radius: 50%; }
.hero-copy, .hero-score { position: relative; z-index: 1; }
.hero-kicker { display: flex; align-items: center; gap: 9px; color: #b8d8c8; font-size: 10px; letter-spacing: .6px; }
.hero-kicker:before { content: ""; width: 20px; height: 1px; background: #90c7aa; }
.hero-card h2 { max-width: 530px; margin: 14px 0 10px; font-size: clamp(22px, 3vw, 31px); line-height: 1.33; letter-spacing: -.8px; }
.hero-card p { max-width: 550px; margin: 0; color: #c1d8cd; font-size: 11px; line-height: 1.8; }
.hero-actions { display: flex; align-items: center; gap: 14px; margin-top: 19px; }
.hero-card .button-primary { background: #cce8d7; color: #164b3e; box-shadow: none; }
.hero-card .button-primary:hover { background: #e1f1e7; }
.hero-card .button-link { color: #c6e3d1; }
.hero-score { justify-self: center; text-align: center; }
.score-ring { width: 132px; height: 132px; padding: 8px; border-radius: 50%; background: conic-gradient(#bfe5ce var(--score), rgba(225, 244, 231, .13) 0); transform: rotate(-90deg); }
.score-ring-inner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(233, 249, 239, .2); border-radius: 50%; background: #174c40; transform: rotate(90deg); }
.score-ring-inner strong { font-size: 29px; letter-spacing: -1.5px; }
.score-ring-inner small { margin-top: 1px; color: #b4d6c4; font-size: 9px; }
.score-caption { margin-top: 10px; color: #c6dfd0; font-size: 10px; }
.hero-footnote { margin-top: 9px; color: #a6c9b6; font-size: 9px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0 20px; }
.stat-card { min-height: 104px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
.stat-top { display: flex; justify-content: space-between; align-items: center; color: #84918b; font-size: 10px; }
.stat-icon { width: 26px; height: 26px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); border-radius: 8px; font-size: 13px; }
.stat-value { margin-top: 7px; color: var(--ink); font-size: 23px; font-weight: 650; letter-spacing: -.75px; }
.stat-value small { margin-left: 5px; color: #929e98; font-size: 10px; font-weight: 500; letter-spacing: 0; }
.stat-foot { margin-top: 2px; color: #95a19b; font-size: 9px; }
.grid-two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 15px; }
.grid-equal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.stack { display: grid; gap: 15px; }
.card { min-width: 0; padding: 19px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 2px 8px rgba(40, 70, 58, .015); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.card-header h3 { margin: 0; font-size: 13px; letter-spacing: -.15px; }
.card-header p { margin: 5px 0 0; color: #8b9791; font-size: 10px; line-height: 1.55; }
.section-label { margin: 22px 0 10px; color: #96a19b; font-size: 9px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; }
.skill-list { display: grid; gap: 11px; }
.skill-line { display: grid; grid-template-columns: minmax(100px, .9fr) minmax(90px, 1fr) 32px; align-items: center; gap: 12px; }
.skill-line-name { overflow: hidden; color: #3d4d46; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.skill-line-meta { display: flex; align-items: center; gap: 8px; }
.mini-track { width: 100%; height: 6px; overflow: hidden; border-radius: 99px; background: #edf1ed; }
.mini-track > span { display: block; height: 100%; border-radius: inherit; background: #68ab87; }
.mini-track > span.gap-fill { background: #e3b36a; }
.skill-line-value { color: #7e8b84; font-size: 9px; text-align: right; }
.level-text { color: #84918a; font-size: 9px; }
.gap-summary { display: grid; gap: 11px; }
.gap-item { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; padding-bottom: 10px; border-bottom: 1px solid #f0f2f0; }
.gap-item:last-child { border-bottom: 0; padding-bottom: 0; }
.gap-item strong { font-size: 10px; font-weight: 600; }
.gap-item span { color: #9b7a4c; font-size: 9px; }
.gap-item small { grid-column: 1 / -1; color: #8e9a94; font-size: 9px; }
.empty-state { padding: 19px 12px; text-align: center; color: #8f9c95; font-size: 11px; line-height: 1.7; border-radius: 10px; background: #f7f9f7; }
.empty-state strong { display: block; margin-bottom: 3px; color: #52635b; font-size: 12px; }
.next-step { display: flex; align-items: flex-start; gap: 12px; padding: 13px; border-radius: 11px; background: #f0f7f2; }
.step-number { width: 26px; height: 26px; flex: 0 0 auto; display: grid; place-items: center; color: white; background: var(--green); border-radius: 9px; font-size: 11px; font-weight: 700; }
.next-step strong { display: block; font-size: 11px; }
.next-step p { margin: 5px 0 8px; color: #7c8a82; font-size: 9px; line-height: 1.6; }
.mini-progress { height: 5px; overflow: hidden; border-radius: 99px; background: #e8eee9; }
.mini-progress > span { display: block; height: 100%; border-radius: inherit; background: #71ae8e; }
.progress-caption { display: flex; justify-content: space-between; margin-top: 6px; color: #92a098; font-size: 9px; }
.signal-strip { padding: 17px 19px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 15px; border: 1px solid #dceae1; border-radius: 13px; background: #edf6f0; }
.signal-icon { width: 38px; height: 38px; display: grid; place-items: center; color: #27775c; background: #d9eee2; border-radius: 11px; font-size: 16px; }
.signal-strip h3 { margin: 0; font-size: 11px; }
.signal-strip p { margin: 5px 0 0; color: #778980; font-size: 9px; line-height: 1.6; }
.signal-strip .button-link { white-space: nowrap; }
.sdg-card { position: relative; overflow: hidden; padding: 17px; border-radius: 12px; color: #fff; background: #4b8a6d; }
.sdg-card.blue { background: #397c8d; }
.sdg-card-top { display: flex; justify-content: space-between; gap: 10px; }
.sdg-number { color: rgba(255,255,255,.64); font-size: 9px; font-weight: 700; letter-spacing: 1px; }
.sdg-card h4 { margin: 8px 0 6px; font-size: 13px; }
.sdg-card p { max-width: 440px; margin: 0; color: rgba(255,255,255,.82); font-size: 9px; line-height: 1.65; }
.sdg-card a { display: inline-block; margin-top: 12px; color: #e4f4e9; font-size: 9px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.4); }
.sdg-footnote { margin-top: 9px; color: #8d9992; font-size: 9px; line-height: 1.6; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 99px; color: #63746a; background: #f0f3f0; font-size: 9px; white-space: nowrap; }
.pill.green { color: #27745b; background: #e5f3eb; }
.pill.amber { color: #9b6b2f; background: #faf0dd; }
.pill.blue { color: #4d7690; background: #eaf2f7; }
.pill.gray { color: #7f8b85; background: #f0f2f0; }
.source-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.source-link { color: #37745c; font-size: 9px; font-weight: 600; text-decoration: none; }
.source-link:hover { text-decoration: underline; }
.source-row { margin-top: 11px; padding-top: 10px; border-top: 1px solid #eef1ee; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: #84918a; font-size: 9px; }
.freshness { display: inline-flex; align-items: center; gap: 5px; }
.freshness:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #d5a251; }
.freshness.fresh:before { background: #58a783; }
.fact-note { padding: 9px 11px; border-left: 2px solid #99c2a9; color: #77847d; background: #f6f9f6; font-size: 9px; line-height: 1.65; }
.data-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 15px; }
.scenario-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f1f4f1; }
.scenario-tabs button { padding: 7px 11px; border: 0; border-radius: 7px; color: #798780; background: transparent; font-size: 9px; cursor: pointer; }
.scenario-tabs button.active { color: #235e4b; background: white; box-shadow: 0 1px 5px rgba(30,55,44,.08); font-weight: 650; }
.scenario-panel { margin-top: 14px; padding: 17px; border: 1px solid #e4eae5; border-radius: 12px; background: #fbfcfb; }
.scenario-panel h3 { margin: 0 0 7px; font-size: 13px; }
.scenario-panel p { margin: 0; color: #77847d; font-size: 10px; line-height: 1.75; }
.scenario-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.scenario-metric { padding: 12px; border-radius: 9px; background: #fff; border: 1px solid #edf0ed; }
.scenario-metric strong { display: block; color: #235d4a; font-size: 18px; letter-spacing: -.5px; }
.scenario-metric small { display: block; margin-top: 4px; color: #8b9791; font-size: 9px; line-height: 1.5; }
.scenario-impact { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 13px; }
.impact-box { padding: 12px; border-radius: 10px; background: #f2f6f3; }
.impact-box strong { display: block; margin-bottom: 6px; color: #53645a; font-size: 9px; }
.impact-box span { color: #7b8981; font-size: 9px; line-height: 1.65; }
.confidence-meter { display: flex; gap: 4px; }
.confidence-meter i { width: 17px; height: 4px; border-radius: 9px; background: #e5e9e5; }
.confidence-meter i.on { background: #6eae8c; }

.profile-toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 15px 17px; border-radius: 12px; background: #eff6f1; border: 1px solid #e0ebe3; }
.profile-toolbar p { margin: 0; color: #687a70; font-size: 10px; line-height: 1.6; }
.profile-toolbar strong { color: #2c5948; }
.profile-form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
.field { display: grid; gap: 6px; }
.field label { color: #6c7b73; font-size: 9px; font-weight: 600; }
.field input, .field select, .inline-input, .select-control { width: 100%; min-height: 38px; padding: 0 10px; outline: none; border: 1px solid #e1e7e2; border-radius: 8px; color: #394a42; background: #fff; font-size: 10px; }
.field input:focus, .field select:focus, .inline-input:focus, .select-control:focus { border-color: #82b59a; box-shadow: 0 0 0 3px #e6f3eb; }
.field-help { color: #9aa49e; font-size: 9px; }
.role-requirement-editor { width: 100%; padding: 12px; border: 1px solid #e4eae5; border-radius: 10px; background: #fafcfb; }
.role-requirement-editor > summary { color: #315f4a; font-size: 10px; font-weight: 700; cursor: pointer; }
.role-requirement-editor > summary span { margin-left: 5px; color: #8b9990; font-weight: 500; }
.role-requirement-editor > p { margin: 8px 0 11px; color: #829087; font-size: 9px; line-height: 1.6; }
.role-requirement-groups { display: grid; gap: 10px; max-height: 330px; overflow: auto; padding-right: 3px; }
.role-requirement-groups h4 { margin: 0 0 6px; color: #738078; font-size: 9px; }
.role-requirement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.role-requirement-item { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 7px; border: 1px solid #e9eee9; border-radius: 7px; background: #fff; }
.role-requirement-item input { accent-color: var(--green); }
.role-requirement-item span { flex: 1; overflow: hidden; color: #5e6e64; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.role-requirement-item select { width: 92px; min-width: 76px; height: 27px; border: 1px solid #e3e9e3; border-radius: 6px; color: #62736a; background: #fff; font-size: 8px; }
.role-requirement-item select:disabled { color: #abb4ae; background: #f5f7f5; }
.skill-category { margin-top: 19px; }
.skill-category h3 { margin: 0 0 9px; color: #708078; font-size: 10px; }
.catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.catalog-item { min-width: 0; display: flex; align-items: center; gap: 9px; padding: 10px 11px; border: 1px solid #e8ece8; border-radius: 9px; background: #fff; }
.catalog-item input[type="checkbox"] { accent-color: var(--green); }

.history-list { display: grid; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #edf0ed; }

#celebration { position: fixed; inset: 0; z-index: 40; overflow: hidden; pointer-events: none; }

/* Interface polish: clearer hierarchy, readable controls, and accessible focus states. */

  --line: #e1e8e2;
  --canvas: #f4f7f4;
  --shadow: 0 14px 36px rgba(35, 65, 55, .075);
}
body {
  color: #20332c;
  background: radial-gradient(ellipse at 78% 0%, rgba(220, 238, 225, .34), transparent 34rem), var(--canvas);
}
@media (min-width: 761px) {
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(14px);
}
.content { padding-top: 34px; }
.page-intro { margin-bottom: 24px; }
.page-intro h2 { font-size: clamp(22px, 2vw, 26px); }
.page-intro p { font-size: 13px; line-height: 1.75; }
.card {
  border-color: #e3eae4;
  box-shadow: 0 3px 12px rgba(40, 70, 58, .035);
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;

.button { min-height: 40px; font-size: 12px; }

.field label { color: #53665c; font-size: 11px; }
.field input, .field select, .inline-input, .select-control { min-height: 42px; font-size: 12px; }
.field textarea { min-height: 92px; font-size: 12px; }
.field-help { color: #77877d; font-size: 10px; line-height: 1.55; }
.role-requirement-editor {

.role-requirement-item select { height: 31px; min-width: 82px; font-size: 10px; }
.field .role-requirement-item select { flex: 0 0 92px; width: 92px; min-width: 82px; min-height: 31px; height: 31px; padding: 0 7px; font-size: 10px; }
.catalog-item {

@media (prefers-reduced-motion: reduce) {

/* Keep market scope compact while leaving source provenance visible. */
.market-scope-banner {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 6px;
  margin-bottom: 10px;
  padding: 10px 14px;
}
.market-scope-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 12px; min-width: 0; }
.market-scope-banner > .market-scope-head > strong { flex: 0 0 auto; font-size: 12px; }
.market-scope-banner > .market-scope-head > p { min-width: 0; margin: 0; color: #66776e; font-size: 10px; line-height: 1.5; }
.market-scope-banner > .source-meta { gap: 5px 7px; margin-top: 0; }
.market-scope-banner .pill, .market-scope-banner .source-link { font-size: 9px; }
@media (max-width: 520px) {
  .market-scope-banner { padding: 9px 11px; }
  .market-scope-head { gap: 3px 8px; }
  .market-source-meta { grid-template-columns: 1fr; }
}

/* Market breadth and company exploration */
.industry-panel { margin-bottom: 18px; }
.industry-header { align-items: flex-start; }
.industry-picker { display: grid; gap: 5px; min-width: min(280px, 100%); color: #6d7d73; font-size: 10px; }
.industry-picker select { min-height: 38px; font-size: 11px; }
.industry-focus { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin: 15px 0; }
.industry-focus > div { display: grid; gap: 7px; min-width: 0; padding: 13px; border: 1px solid #e5ece6; border-radius: 12px; background: #fafcfb; }
.industry-focus span { color: #718078; font-size: 10px; }
.industry-focus strong { overflow-wrap: anywhere; color: #244b39; font-size: 16px; line-height: 1.35; }
.industry-details { border-top: 1px solid #e8eee9; }
.industry-details > summary { padding: 12px 2px; color: #456552; cursor: pointer; font-size: 11px; font-weight: 650; }
.industry-extra-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 18px; padding: 6px 0 14px; }
.industry-extra-grid h4 { margin: 8px 0 4px; color: #405a49; font-size: 11px; }
.industry-extra-grid section > p, .category-select-row p { margin: 0 0 9px; color: #7b8980; font-size: 9px; line-height: 1.55; }
.category-select-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.category-select-row .industry-picker { min-width: 220px; }
.table-scroll { overflow-x: auto; }
.industry-table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 10px; }
.industry-table th, .industry-table td { padding: 9px 10px; border-bottom: 1px solid #edf1ed; text-align: left; white-space: nowrap; }
.industry-table thead th { color: #68796e; font-weight: 650; }
.industry-table tbody th { color: #3e5447; font-weight: 550; }
.industry-table td { color: #596b60; }
.industry-bar { width: 140px; height: 7px; overflow: hidden; border-radius: 99px; background: #edf2ed; }
.industry-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9dc4a8, #43865d); }
.industry-caveat { margin: 12px 0 0; color: #718078; font-size: 10px; line-height: 1.7; }
.company-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.company-overview > div { display: grid; align-content: start; gap: 5px; min-width: 0; padding: 13px 15px; border: 1px solid #e4ebe5; border-radius: 13px; background: linear-gradient(145deg, #fff, #f8fbf8); }
.company-overview span, .company-overview small { color: #75847b; font-size: 10px; }
.company-overview strong { overflow-wrap: anywhere; color: #244b39; font-size: 15px; line-height: 1.35; }
.company-directory-card { padding: 20px; }
.company-tools { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.company-tools h3 { margin: 0 0 5px; font-size: 14px; }
.company-tools p { margin: 0; color: #74837a; font-size: 10px; line-height: 1.6; }
.company-search { flex: 0 1 290px; }
.company-search input { width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid #dfe8e1; border-radius: 10px; background: #fff; color: #2e4437; font: inherit; font-size: 11px; }
.company-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 15px 0 13px; padding-top: 12px; border-top: 1px solid #edf1ed; color: #89958d; font-size: 9px; }
.company-filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.company-filter { min-height: 31px; padding: 0 11px; border: 1px solid #e3eae4; border-radius: 999px; background: white; color: #65766b; cursor: pointer; font: inherit; font-size: 10px; }
.company-filter.active { border-color: #b7d1bf; background: #edf6ef; color: #2c6944; }
.company-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.company-card { display: flex; min-width: 0; flex-direction: column; gap: 12px; padding: 15px; border: 1px solid #e3eae4; border-radius: 14px; background: #fff; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.company-card:hover { transform: translateY(-2px); border-color: #c6dacb; box-shadow: 0 10px 22px rgba(40, 70, 58, .07); }
.company-card-head { display: flex; align-items: center; gap: 10px; }
.company-mark { display: grid; width: 40px; height: 40px; flex: 0 0 auto; place-items: center; border: 1px solid #dfebe1; border-radius: 13px; background: linear-gradient(145deg, #f2f8f3, #e6f1e8); color: #3e7651; font-size: 15px; font-weight: 750; }
.company-title { min-width: 0; flex: 1; }
.company-title h3 { margin: 0; color: #30493a; font-size: 13px; }
.company-title p { margin: 4px 0 0; color: #7b8980; font-size: 10px; }
.company-star { width: 31px; height: 31px; border: 1px solid #e5ece6; border-radius: 9px; background: #fff; color: #839187; cursor: pointer; font-size: 18px; line-height: 1; }
.company-star.active { border-color: #eed28b; background: #fff9e8; color: #c48919; }
.company-fit { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.company-fit .pill { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
.company-fit > div { display: grid; justify-items: end; gap: 3px; }
.company-fit > div strong { color: #3f7151; font-size: 12px; }
.company-fit > div small { color: #8a958e; font-size: 8px; }
.company-note { min-height: 46px; margin: 0; color: #74837a; font-size: 9px; line-height: 1.6; }
.company-card-actions { display: grid; grid-template-columns: 1fr; gap: 7px; margin-top: auto; }
.company-card-actions .button { min-height: 35px; padding: 0 10px; font-size: 10px; }
.company-career-link { display: flex; align-items: center; justify-content: center; text-decoration: none; }
.company-feedback { display: flex; align-items: center; gap: 5px; padding-top: 9px; border-top: 1px solid #f0f3f0; }
.company-feedback span { margin-right: auto; color: #87938b; font-size: 9px; }
.company-feedback button { padding: 5px 8px; border: 1px solid #e8ede9; border-radius: 8px; background: #fff; color: #718078; cursor: pointer; font: inherit; font-size: 9px; }
.company-feedback button.selected { border-color: #bfd7c4; background: #f0f7f1; color: #3f7651; }
.company-data-note { margin-top: 14px; padding: 12px 14px; border: 1px solid #e7eee8; border-radius: 12px; background: #f8fbf8; }
.company-data-note strong { color: #52685a; font-size: 10px; }
.company-data-note p { margin: 5px 0 0; color: #7b8980; font-size: 9px; line-height: 1.7; }
.company-empty { grid-column: 1 / -1; padding: 28px; border: 1px dashed #dce7de; border-radius: 12px; color: #718078; text-align: center; font-size: 11px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 1000px) {
  .company-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .company-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .industry-header, .company-tools { display: grid; }
  .industry-picker, .company-search { width: 100%; min-width: 0; }
  .industry-focus { grid-template-columns: 1fr; }
  .industry-extra-grid { grid-template-columns: 1fr; }
  .category-select-row { align-items: stretch; flex-direction: column; }
  .category-select-row .industry-picker { min-width: 0; }
  .company-grid { grid-template-columns: 1fr; }
  .company-toolbar { align-items: flex-start; flex-direction: column; }
}
@media (max-width: 520px) {
  .company-overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .company-overview > div { padding: 10px; }
  .company-directory-card { padding: 14px; }
}

/* CareerBridge AI local evidence report */
.trend-report { display: grid; gap: 14px; margin: 15px 0 18px; color: #24352b; }
.trend-report[hidden] { display: none; }
.trend-report * { box-sizing: border-box; }
.trend-report-hero { position: relative; overflow: hidden; padding: clamp(18px, 3vw, 28px); border: 1px solid #dce9df; border-radius: 18px; background: radial-gradient(circle at 92% 8%, rgba(181, 221, 192, .6), transparent 30%), linear-gradient(135deg, #f5faf5, #edf5ef 60%, #f7f8ee); }
.trend-report-topline { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.trend-report-eyebrow { color: #527260; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.trend-report-hero h3 { margin: 0 0 9px; color: #20382a; font-size: clamp(21px, 3vw, 29px); letter-spacing: -.035em; }
.trend-report-hero p { max-width: 780px; margin: 0; color: #52665a; font-size: 13px; line-height: 1.75; }
.trend-report-context { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.trend-report-context span { padding: 7px 10px; border: 1px solid #dce8de; border-radius: 999px; color: #496252; background: rgba(255,255,255,.72); font-size: 11px; }
.trend-report-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.trend-report-stat { min-width: 0; padding: 14px; border: 1px solid #e5ebe6; border-radius: 14px; background: #fff; }
.trend-report-stat strong { display: block; margin-bottom: 5px; color: #263b2d; font-size: 19px; line-height: 1.2; }
.trend-report-stat span { display: block; color: #718077; font-size: 10px; line-height: 1.55; }
.trend-report-card { min-width: 0; padding: clamp(15px, 2.5vw, 21px); border: 1px solid #e5ebe6; border-radius: 16px; background: #fff; }
.trend-report-card h4 { margin: 0 0 7px; color: #263a2d; font-size: 15px; }
.trend-report-card > p { margin: 0; color: #68776e; font-size: 11px; line-height: 1.75; }
.trend-report-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.trend-report-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.trend-report-kicker { display: block; margin-bottom: 6px; color: #819087; font-size: 9px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.trend-report-bars { display: grid; gap: 12px; margin: 18px 0 12px; }
.trend-report-barline { display: grid; grid-template-columns: 68px minmax(70px, 1fr) 60px; align-items: center; gap: 10px; }
.trend-report-quarter { color: #66766b; font-size: 10px; font-weight: 650; }
.trend-report-track { height: 10px; overflow: hidden; border-radius: 20px; background: #eef2ef; }
.trend-report-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5c9d72, #91c39a); }
.trend-report-barline:nth-child(2) .trend-report-bar { background: linear-gradient(90deg, #6489c2, #9db7e0); }
.trend-report-value { color: #3c5144; font-size: 10px; font-variant-numeric: tabular-nums; font-weight: 750; text-align: right; }
.trend-report-inline-source { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; color: #39744c; font-size: 10px; font-weight: 700; text-decoration: none; }
.trend-report-inline-source:hover { text-decoration: underline; }
.trend-report-note { margin-top: 13px; padding: 10px 12px; border-left: 3px solid #d4a94c; border-radius: 0 9px 9px 0; color: #71613e; background: #fbf8ef; font-size: 10px; line-height: 1.7; }
.trend-report-note.blue { border-color: #82a4d2; color: #4d6381; background: #f2f6fb; }
.trend-report-note.green { border-color: #78ae85; color: #486b50; background: #f2f8f3; }
.trend-report-list { display: grid; gap: 10px; margin: 13px 0 0; padding: 0; list-style: none; }
.trend-report-list li { position: relative; padding-left: 17px; color: #617066; font-size: 11px; line-height: 1.7; }
.trend-report-list li:before { position: absolute; top: 0; left: 1px; color: #6b9e76; content: "•"; font-size: 16px; font-weight: 800; }
.trend-report-label { display: inline-block; margin: 2px 5px 2px 0; padding: 4px 7px; border-radius: 99px; color: #42694d; background: #edf5ee; font-size: 9px; font-weight: 700; }
.trend-report-summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 17px; border: 1px solid #eadfbf; border-radius: 15px; background: linear-gradient(120deg, #fffdf7, #faf7ed); }
.trend-report-summary-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: #826c37; background: #f3e9c8; font-size: 17px; }
.trend-report-summary h4 { margin: 1px 0 5px; color: #51482f; font-size: 13px; }
.trend-report-summary p { margin: 0; color: #756d57; font-size: 11px; line-height: 1.7; }
.trend-report-sources { padding: 0; overflow: hidden; }
.trend-report-sources summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 19px; color: #33483a; cursor: pointer; font-size: 12px; font-weight: 750; list-style: none; }
.trend-report-sources summary::-webkit-details-marker { display: none; }
.trend-report-sources summary:after { color: #779181; content: "+"; font-size: 17px; }
.trend-report-sources[open] summary:after { content: "−"; }
.trend-source-list { display: grid; gap: 0; margin: 0; padding: 0 19px 8px; list-style: none; }
.trend-source-list li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid #edf0ed; }
.trend-source-id { color: #7b8c80; font-size: 9px; font-weight: 800; }
.trend-source-list a { color: #39744c; font-size: 10px; font-weight: 750; text-decoration: none; }
.trend-source-list a:hover { text-decoration: underline; }
.trend-source-list small { display: block; margin-top: 4px; color: #879189; font-size: 9px; line-height: 1.55; }
.trend-report-footer { color: #89948c; font-size: 9px; line-height: 1.6; text-align: center; }
@media (max-width: 760px) {
  .trend-report-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trend-report-card-grid { grid-template-columns: 1fr; }
  .trend-report-hero { border-radius: 15px; }
}
@media (max-width: 430px) {
  .trend-report-stats { gap: 7px; }
  .trend-report-stat { padding: 11px; }
  .trend-report-stat strong { font-size: 16px; }
  .trend-report-barline { grid-template-columns: 58px minmax(50px, 1fr) 52px; gap: 7px; }
  .trend-report-summary { gap: 9px; padding: 13px; }
}

  function renderSelfAssessment(name) {

      '<div class="card" style="margin-bottom:13px"><div class="card-header"><div><h3>职业趋势文章生成器</h3><p>输入任意地区、职业和周期，查看按输入生成的趋势分析文章。</p></div><span class="pill amber">任意职业 · 实时检索</span></div><form id="trend-request-form" class="grid-two" action="" method="get" style="align-items:end"><input type="hidden" name="view" value="report"><input type="hidden" name="language" value="en"><label class="field"><span>目标地区</span><input name="trendRegion" required maxlength="80" placeholder="可输入任意国家或地区，例如：马来西亚、英国、日本"></label><label class="field"><span>目标职业</span><input name="trendRole" required maxlength="100" placeholder="可输入任意职业，例如：护理师、律师、产品经理"></label><label class="field"><span>行业或主要工作内容（可选）</span><input name="trendContext" maxlength="180" placeholder="例如：负责供应链预测、客户风险或产品规划"></label><label class="field"><span>分析周期</span><select name="trendHorizon"><option>未来 1–3 年</option><option selected>未来 3–5 年</option><option>未来 5–10 年</option></select></label><div><button class="button button-primary" type="submit">生成报告 ↗</button></div></form><div id="trend-request-status" class="fact-note" role="status" aria-live="polite" style="margin-top:12px">可输入任意职业。提交后由服务器调用 DeepSeek 实时检索就业、AI、资本和政策资料，再生成带来源编号的职业分析文章。需要从网站服务地址打开；直接双击 HTML 离线文件无法调用后端，API 密钥不会放在网页中。</div></div><div class="data-legend"><span class="pill green">来源事实：外部报告内容</span><span class="pill blue">产品解释：技能与岗位映射</span><span class="pill amber">情景推演：明确标注的假设</span></div><div class="factor-overview"><div class="factor-heading"><div><span class="factor-kicker">四类驱动因素 · 适用于任意职业输入</span><h3>哪些力量正在改变岗位？</h3><p>把技术、资本、政策与招聘放在同一张图里看，区分已发生的事实与对岗位的推论。</p></div><span class="pill blue">资料截至 2026-10-23</span></div><div class="factor-grid"><article class="factor-card factor-ai"><span class="factor-label">01 · AI 与任务变化</span><strong>先分解岗位任务，再讨论 AI 影响</strong><p>任务构成因职业不同。报告会按岗位类别讨论可能被工具辅助的任务，并与人类判断、责任和现场情境区分。</p><span class="factor-foot">影响：常规生成可提速；准确性、业务判断与责任仍需人把关。</span></article><article class="factor-card factor-capital"><span class="factor-label">02 · 资本与基础设施</span><strong>资本与基础设施要看地区证据</strong><p>资本流向因国家和行业不同。需检查获批项目、落地进度、岗位分布，不能把投资金额直接换算成职位数。</p><span class="factor-foot">影响：只有项目落地并形成业务需求，才会传导到具体岗位。</span></article><article class="factor-card factor-policy"><span class="factor-label">03 · 政府政策与治理</span><strong>政策影响依国家与行业而变</strong><p>政府政策会影响 AI 采用、数据责任、培训和产业投资；不同地区适用的法律和计划并不相同。</p><span class="factor-foot">影响：先核实当地法规状态，再判断对具体职业的职责影响。</span></article><article class="factor-card factor-jobs"><span class="factor-label">04 · 本地招聘脉搏</span><strong>招聘信号须匹配职位与统计口径</strong><p>岗位广告需要匹配地区、职业代码和统计口径；没有目标岗位数据时，报告会显示缺口，不借用相邻职位数字。</p><span class="factor-foot">影响：招聘数量、薪资和趋势需要从当地官方或可审计来源核实。</span></article></div><a class="factor-report-link" href="#trend-request-form">输入职业后生成完整趋势文章 <span aria-hidden="true">↗</span></a></div>' +
      '<section class="card" style="margin-bottom:13px"><div class="card-header"><div><h3>未来情景比较</h3><p>切换情景会影响路径排序；由你决定采用哪种假设。</p></div><div class="scenario-tabs"><button class="' + (state.scenario === "baseline" ? "active" : "") + '" data-action="scenario" data-scenario="baseline">基准变化</button><button class="' + (state.scenario === "accelerated" ? "active" : "") + '" data-action="scenario" data-scenario="accelerated">AI 加速普及</button></div></div>' + renderScenarioPanel() + '<div class="source-meta">' + sourceLink(jobs, "WEF 2025 新闻稿") + '<span class="pill gray">发布 ' + escapeHtml(jobs.published) + '</span><span class="pill gray">查阅 ' + escapeHtml(jobs.retrieved) + "</span></div></section>" +
      '<section class="signal-grid"><article class="card signal-card"><div class="signal-body"><div class="card-header"><div><span class="pill green">企业预期 · 2025–2030</span><h3 style="margin-top:10px">AI、大数据与技术素养走强</h3></div><span class="pill">中等可信度</span></div><p>WEF 报告将 AI 与大数据列为增长最快的技能类别之一，网络安全和技术素养也在前列；创造性思维、韧性与持续学习同样受到关注。</p><div class="trend-chip-row"><span class="trend-chip">AI 与大数据</span><span class="trend-chip">网络安全</span><span class="trend-chip">技术素养</span><span class="trend-chip">分析思维</span><span class="trend-chip">持续学习</span></div></div><div class="source-row">' + sourceLink(base, "查看 WEF 技能展望") + "<span>发布 " + escapeHtml(base.published) + "</span><span>查阅 " + escapeHtml(base.retrieved) + '</span></div><div class="fact-note">来源为企业对未来技能重要性的预期，不是本地招聘广告的统计变化。</div></article>' +
      '<article class="card signal-card"><div class="signal-body"><div class="card-header"><div><span class="pill blue">岗位结构 · 全球汇总</span><h3 style="margin-top:10px">岗位变化伴随再培训需求</h3></div><span class="pill">调查预期</span></div><div class="signal-big">+78m</div><p>WEF 汇总的预期为：至 2030 年新增 170m 个岗位、被替代 92m 个岗位，净增 78m。数字反映报告调查预期，不能直接推断某个岗位或个人的结果。</p><div class="source-meta"><span class="pill">调查涉及 1,000+ 家企业</span><span class="pill">全球样本</span></div></div><div class="source-row">' + sourceLink(jobs, "查看原始发布") + "<span>发布日期 " + escapeHtml(jobs.published) + "</span><span>采集 " + escapeHtml(jobs.retrieved) + "</span></div></article></section>" +
      '<div class="section-label">数据追溯</div><article class="card"><div class="card-header"><div><h3>趋势来源与适用边界</h3><p>每项信号都保留发布者、发布日期、查阅日期和覆盖范围。</p></div><span class="pill green">可点击核验</span></div><div class="table-wrap"><table class="traceability-table"><thead><tr><th>信号</th><th>来源与日期</th><th>覆盖范围</th><th>可信度判断</th></tr></thead><tbody><tr><td>增长技能展望</td><td>' + sourceLink(base, "WEF Future of Jobs 2025") + "<br>发布 " + escapeHtml(base.published) + " · 查阅 " + escapeHtml(base.retrieved) + "</td><td>" + escapeHtml(base.coverage) + '</td><td>中等：权威机构汇总，但属于企业预期，不能替代地区职位数据。</td></tr><tr><td>岗位创造与替代展望</td><td>' + sourceLink(jobs, "WEF 新闻稿") + "<br>发布 " + escapeHtml(jobs.published) + " · 查阅 " + escapeHtml(jobs.retrieved) + "</td><td>" + escapeHtml(jobs.coverage) + '</td><td>中等：方法透明的调查汇总；不是个体岗位的确定结果。</td></tr><tr><td>岗位能力基线</td><td>CareerBridge 演示配置 · 可由用户修改</td><td>仅用于演示目标岗位匹配；未接入本地招聘职位库。</td><td>低：示例值，不是经验证的行业标准。</td></tr></tbody></table></div></article>' +

  function roleRecommendation(role) {
    const req = roleRequirements[role] || {};
    const names = Object.keys(req);
    const assessed = names.filter(function (name) { return currentLevel(name) != null; });
    const covered = assessed.filter(function (name) { return currentLevel(name) >= req[name]; });
    const profileText = [state.profile.student && state.profile.student.major, state.profile.student && state.profile.student.interests, state.profile.worker && state.profile.worker.currentRole, state.profile.worker && state.profile.worker.transitionGoal].join(" ").toLowerCase();
    const interestFit = (roleTags[role] || [role]).some(function (term) { return term && profileText.indexOf(term.toLowerCase()) >= 0; });
    const score = assessed.length ? Math.round(assessed.reduce(function (sum, name) { return sum + Math.min(currentLevel(name), req[name]) / req[name]; }, 0) / assessed.length * 100) : null;
    return { role: role, covered: covered.length, assessed: assessed.length, total: names.length, interestFit: interestFit, score: names.length > 0 && assessed.length === names.length ? score : null };
  }
  function renderWorkerTaskReview() {
    if (state.profile.userType !== "worker") return "";
    const tasks = String(state.profile.worker.tasks || "").split(/[\n;；、。]+/).map(function (task) { return task.trim(); }).filter(Boolean).slice(0, 8);
    const entries = tasks.map(function (task) {

  function addCustomSkill(inputId, assessmentOnly) {

    }

  function submitAssessment() {
    const draft = state.draftAssessment;
    if (!draft.selected.length) { showToast("请先选择至少一项能力。"); return; }
    const results = [];
    draft.selected.forEach(function (name) {
      if (draft.mode === "self") {
        const level = Number(draft.selfLevels[name] || 0);
        if (!level) return;
        const info = levelInfo(level);
        const evidence = "用户自评为“" + info.label + "”；尚未由任务表现独立验证";
        state.skills[name] = { enabled: true, level: level, source: "自评", confidence: 0.45, evidence: evidence, date: today() };
        results.push({ name: name, label: level + " · " + info.short, evidence: evidence, confidence: 0.45, score: null, version: "自评", date: today() });
      } else {
        const bank = assessmentQuestions(name, draft.shuffleSeed);
        const answers = draft.answers[name] || [];
        let answered = 0;
        let correct = 0;
        const details = [];
        bank.forEach(function (question, index) {
          const choice = answers[index];
          if (choice == null || choice === "") return;
          answered += 1;
          const isCorrect = Number(choice) === question.answer;
          if (isCorrect) correct += 1;
          details.push({
            question: question.prompt,
            type: question.type || "知识判断",
            correct: isCorrect,
            answer: question.options[question.answer],
            explain: question.explain
          });
        });
        if (!answered) return;
        const score = Math.round(correct / answered * 100);
        const coverage = Math.round(answered / bank.length * 100);
        const level = coverage < 60 ? null : score >= 80 ? 4 : score >= 60 ? 3 : score >= 40 ? 2 : 1;
        const confidence = Math.min(0.45, 0.2 + answered / bank.length * 0.25);
        const evidence = "情境/知识筛查答对 " + correct + "/" + answered + " 题，题目覆盖 " + coverage + "%；题库尚未校准";
        state.skills[name] = { enabled: true, level: level, source: "10 题初步筛查（未校准）", confidence: confidence, evidence: evidence, date: today(), version: ASSESSMENT_VERSION };
        results.push({ name: name, label: level == null ? "证据不足 · 待补测" : "初步等级 " + level + " · " + levelShort(level), evidence: evidence, confidence: confidence, score: score, details: details, version: ASSESSMENT_VERSION, date: today() });
      }
    });
    if (!results.length) { showToast("没有可保存的结果。请完成自评或至少回答一道短测题。"); return; }
    draft.results = results;
    state.pathDirty = true;
    state.history.push({ date: today(), mode: draft.mode, version: draft.mode === "diagnostic" ? ASSESSMENT_VERSION : "自评", results: results });
    if (state.history.length > 50) state.history = state.history.slice(-50);
    persist();
    renderApp();
    showToast("评估结果已保存；可信度和证据来源已保留。");
  }

    currentView = "profile";
    renderApp();
    showToast("本地资料已清除。");
  }


  document.addEventListener("input", function (event) {
    if (event.target.matches("[data-market-country-search]")) {
      renderMarketCountryResults(event.target.value);
      return;
    }
    if (!event.target.matches("[data-company-search]")) return;
    companySearchQuery = event.target.value;
    const results = document.getElementById("company-results");
    if (results) results.innerHTML = renderCompanyResults();
  });
  document.addEventListener("focusin", function (event) {
    if (!event.target.matches("#market-country-search")) return;
    event.target.select();
    renderMarketCountryResults("");
  });

  document.addEventListener("click", function (event) {
    const nav = event.target.closest("[data-nav]");
    if (nav) { event.preventDefault(); go(nav.getAttribute("data-nav")); return; }
    const control = event.target.closest("[data-action]");
    if (!control) return;
    const action = control.getAttribute("data-action");
    if (action === "toggle-menu") document.getElementById("sidebar").classList.toggle("open");
    else if (action === "edit-profile") openProfileModal();
    else if (action === "close-modal" || (action === "backdrop-close" && event.target === control)) {
      if (modalRoot.querySelector("#auth-form")) pendingProfileAfterAuth = false;
      modalRoot.innerHTML = "";
    }
    else if (action === "go-assessment") go("assessment");
    else if (action === "go-profile") go("profile");
    else if (action === "go-signals") go("signals");
    else if (action === "go-market") go("market");
    else if (action === "go-path") go("path");
    else if (action === "open-auth") openAuthModal("login");
    else if (action === "start-file-demo") { modalRoot.innerHTML = ""; go("assessment"); }
    else if (action === "auth-mode") openAuthModal(control.getAttribute("data-mode"));
    else if (action === "open-recovery") openAuthModal("recover");
    else if (action === "logout") logout();
    else if (action === "delete-account") deleteAccount();
    else if (action === "finish-registration") { modalRoot.innerHTML = ""; renderApp(); showToast("账户已创建。继续完善档案；资料会自动保存到本地服务。"); continueProfileAfterAuth(); }
    else if (action === "copy-recovery") {
      const code = modalRoot.querySelector(".recovery-code");
      if (code && navigator.clipboard) navigator.clipboard.writeText(code.textContent).then(function () { showToast("恢复码已复制，请仍将它保存到安全位置。"); }).catch(function () { showToast("复制失败，请手动选中恢复码。"); });
    }
    else if (action === "stage-exam-start") startStageExam();
    else if (action === "submit-stage-exam") submitStageExam(false);
    else if (action === "exam-answer") {
      if (!state.exam || state.exam.status !== "active") return;
      state.exam.answers[control.getAttribute("data-index")] = Number(control.getAttribute("data-option"));
      control.closest(".answer-options").querySelectorAll(".answer-option").forEach(function (option) { option.classList.toggle("selected", option === control); });
      persist();
    }
    else if (action === "market-region") { const selectedRegion = control.getAttribute("data-region"); state.marketRegion = Object.prototype.hasOwnProperty.call(marketSnapshots, selectedRegion) ? selectedRegion : "china"; persist(); renderApp(); }
    else if (action === "market-country") {
      const code = control.getAttribute("data-code");
      const selectedCountry = marketCountryOptions.find(function (item) { return item.code === code; });
      if (!selectedCountry) return;
      state.marketRegion = code === "CHN" ? "china" : code === "MYS" ? "malaysia" : code === "USA" ? "us" : "country:" + code;
      persist(); renderApp();
    }
    else if (action === "retry-market-signals") {
      const marketKey = control.getAttribute("data-market-key") || state.marketRegion;
      const signalRole = String(state.profile.role || "").trim();
      const selectedCountry = marketCountryForRegion(marketKey);
      const region = selectedCountry ? selectedCountry.name : marketKey === "china" ? "中国" : marketKey === "us" ? "美国" : marketKey === "malaysia" ? "马来西亚" : "中东四国";
      loadMarketRoleSignals(marketKey, region, signalRole, true);
      renderApp();
    }
    else if (action === "retry-market-labor") {
      const code = control.getAttribute("data-code");
      if (marketCountryOptions.some(function (item) { return item.code === code; })) {
        marketLaborCache.delete(code); marketLaborLoading.delete(code); renderApp();
      }
    }
    else if (action === "company-filter") { state.companyActions.filter = control.getAttribute("data-filter") || "all"; persist(); renderApp(); }
    else if (action === "company-favorite") {
      const id = control.getAttribute("data-company-id");
      const index = state.companyActions.favorites.indexOf(id);
      if (index >= 0) state.companyActions.favorites.splice(index, 1); else state.companyActions.favorites.push(id);
      persist(); renderApp(); showToast(index >= 0 ? "已从收藏中移除。" : "已加入公司收藏。 ");
    }
    else if (action === "company-intention") {
      const id = control.getAttribute("data-company-id");
      state.companyActions.intentions[id] = !state.companyActions.intentions[id];
      persist(); renderApp(); showToast(state.companyActions.intentions[id] ? "已记录关注意向。" : "已取消关注意向。 ");
    }
    else if (action === "company-feedback") {
      const id = control.getAttribute("data-company-id");
      const value = control.getAttribute("data-feedback");
      state.companyActions.feedback[id] = state.companyActions.feedback[id] === value ? "" : value;
      persist(); renderApp();
    }
    else if (action === "set-role") {
      if (!DEMO_MODE && !authUser) { openProfileModal(); return; }
      state.profile.role = control.getAttribute("data-role") || ""; state.pathDirty = true; persist(); renderApp(); showToast("已将岗位设为探索目标；你仍可随时修改。");
    }
    else if (action === "assessment-mode") {
      state.draftAssessment.mode = control.getAttribute("data-mode");
      state.draftAssessment.results = null;
      persist(); renderApp();
    } else if (action === "select-self-level") {
      const name = control.getAttribute("data-skill");
      state.draftAssessment.selfLevels[name] = Number(control.getAttribute("data-level"));
      state.draftAssessment.results = null;
      persist(); renderApp();
    } else if (action === "answer-question") {
      const name = control.getAttribute("data-skill");
      const q = Number(control.getAttribute("data-question"));
      if (!state.draftAssessment.answers[name]) state.draftAssessment.answers[name] = [];
      state.draftAssessment.answers[name][q] = Number(control.getAttribute("data-option"));
      state.draftAssessment.results = null;
      control.closest(".answer-options").querySelectorAll(".answer-option").forEach(function (option) { option.classList.toggle("selected", option === control); });
      persist();
    } else if (action === "submit-assessment") submitAssessment();
    else if (action === "scenario") {
      state.scenario = control.getAttribute("data-scenario");
      persist(); renderApp();
    } else if (action === "refresh-path") refreshPath();
    else if (action === "move-path") {
      const id = control.getAttribute("data-id");
      const direction = Number(control.getAttribute("data-direction"));
      const index = state.path.findIndex(function (item) { return item.id === id; });
      const nextIndex = index + direction;
      if (index >= 0 && nextIndex >= 0 && nextIndex < state.path.length) {
        const temp = state.path[index]; state.path[index] = state.path[nextIndex]; state.path[nextIndex] = temp;
        persist(); renderApp();
      }
    } else if (action === "add-skill") addCustomSkill("custom-skill-input", false);
    else if (action === "add-assessment-skill") addCustomSkill("custom-assess-input", true);
    else if (action === "export-data") exportData();
    else if (action === "delete-data") deleteData();
    else if (action === "restore-demo" || action === "start-sample") navigateWorkspace(true, false);
    else if (action === "exit-sample") navigateWorkspace(false, false);
    else if (action === "start-own") {
      if (DEMO_MODE) navigateWorkspace(false, true);
      else authInitialization.then(function () { openProfileModal(); });
    }
    else if (action === "guided-assessment") {
      authInitialization.then(function () {
        const req = requirements();
        if (!req) { openProfileModal(); return; }
        const names = Object.keys(req);
        const next = names.find(function (name) { return currentLevel(name) == null; }) || names[0];
        if (next) state.draftAssessment.selected = [next];
        go("assessment");
      });
    }
  });

  document.addEventListener("change", function (event) {
    const marketIndustry = event.target.closest("[data-market-industry]");
    if (marketIndustry) {
      state.marketIndustry = chinaIndustryWages.some(function (item) { return item.sector === marketIndustry.value; }) ? marketIndustry.value : chinaIndustryWages[8].sector;
      persist(); renderApp(); return;
    }
    const marketJobCategory = event.target.closest("[data-market-job-category]");
    if (marketJobCategory) {
      state.marketJobCategory = chinaJobCategories.some(function (item) { return item.key === marketJobCategory.value; }) ? marketJobCategory.value : "technical";
      persist(); renderApp(); return;
    }
    const toggle = event.target.closest("[data-skill-toggle]");
    if (toggle) {
      const name = toggle.getAttribute("data-skill-toggle");
      const record = skillRecord(name);
      record.enabled = toggle.checked;
      state.pathDirty = true;
      if (!toggle.checked) {
        record.level = null; record.source = ""; record.confidence = null; record.evidence = ""; record.date = "";
      }
      persist(); renderApp(); return;
    }
    const levelSelect = event.target.closest("[data-skill-level]");
    if (levelSelect) {
      const name = levelSelect.getAttribute("data-skill-level");
      const record = skillRecord(name);
      record.enabled = true;
      record.level = levelSelect.value ? Number(levelSelect.value) : null;
      state.pathDirty = true;
      record.source = record.level == null ? "" : "自评";
      record.confidence = record.level == null ? null : 0.4;
      record.evidence = record.level == null ? "" : "用户在能力档案中填写";
      record.date = record.level == null ? "" : today();
      persist(); renderApp(); return;
    }
    const evidenceSource = event.target.closest("[data-evidence-source]");
    if (evidenceSource) {
      const record = skillRecord(evidenceSource.getAttribute("data-evidence-source"));
      record.source = evidenceSource.value;
      if (record.source && record.confidence == null) record.confidence = 0.4;
      if (record.source && !record.date) record.date = today();
      persist(); renderApp(); return;
    }
    const evidenceText = event.target.closest("[data-evidence-text]");
    if (evidenceText) {
      const record = skillRecord(evidenceText.getAttribute("data-evidence-text"));
      record.evidence = evidenceText.value.trim();
      if (record.evidence && !record.source) record.source = "任务证据";
      if (record.evidence && record.confidence == null) record.confidence = 0.4;
      if (record.evidence && !record.date) record.date = today();
      persist(); renderApp(); return;
    }
    const evidenceDate = event.target.closest("[data-evidence-date]");
    if (evidenceDate) {
      const record = skillRecord(evidenceDate.getAttribute("data-evidence-date"));
      record.date = evidenceDate.value;
      persist(); renderApp(); return;
    }
    const selectedSkill = event.target.closest("[data-assess-skill]");
    if (selectedSkill) {
      const name = selectedSkill.getAttribute("data-assess-skill");
      const selected = state.draftAssessment.selected;
      const index = selected.indexOf(name);
      if (selectedSkill.checked && index < 0) selected.push(name);
      if (!selectedSkill.checked && index >= 0) selected.splice(index, 1);
      state.draftAssessment.results = null;
      persist(); renderApp(); return;
    }
    const pathToggle = event.target.closest("[data-path-complete]");
    if (pathToggle) {
      const item = state.path.find(function (entry) { return entry.id === pathToggle.getAttribute("data-path-complete"); });
      if (item) { item.completed = pathToggle.checked; persist(); renderApp(); }
    }
  });

  renderApp();
  authInitialization = initializeAuth();
  authInitialization.finally(function () {
    if (workspaceParams.get("setup") !== "1") return;
    const url = new URL(location.href); url.searchParams.delete("setup"); history.replaceState(null, "", url);
    openProfileModal();
  });
})();

</script>

<script>
(function(){
  "use strict";

  if(params.get("view")!=="report")return;
  const isSampleReport=params.get("sample")==="1";
  let reportLanguage=(params.get("language")||((window.CBLocale&&window.CBLocale.language)||"en"))==="zh"?"zh":"en";
  const pick=(zh,en)=>reportLanguage==="en"?en:zh;
  const role=isSampleReport?pick("数据分析师","Data analyst"):(params.get("trendRole")||"").trim().slice(0,100);
  const region=isSampleReport?pick("中国（全国）","China (national)"):(params.get("trendRegion")||"").trim().slice(0,80);
  const context=(params.get("trendContext")||"").trim().slice(0,180);
  const horizon=(params.get("trendHorizon")||"未来 3–5 年").trim().slice(0,40);
  const escapeHtml=value=>String(value==null?"":value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const homeUrl=new URL(location.href);homeUrl.search="";homeUrl.hash="";
  document.title=reportLanguage==="en"?"Career Trends: "+(role||"Occupation")+" | CareerBridge AI":"未来趋势分析："+(role||"职业")+"｜CareerBridge AI";
  document.body.innerHTML='<div class="career-report-view"><nav class="career-report-nav"><a href="'+escapeHtml(homeUrl.href)+'">← 返回输入页</a><div class="career-live-actions"><button type="button" id="language-toggle" class="language-toggle" data-i18n-skip aria-label="Switch language to Chinese" title="Switch to Chinese">中文</button><button type="button" id="career-copy-link">复制分享链接</button><button type="button" onclick="window.print()">打印 / 保存 PDF</button></div></nav><main class="career-report-shell"><header class="career-report-hero"><div class="career-report-eyebrow">CareerBridge AI · 实时职业趋势报告</div><h1 id="career-report-title">'+escapeHtml(role||"未指定职业")+' 在 '+escapeHtml(region||"未指定地区")+' 的现状与前景</h1><p class="career-report-lead">按地区、职业和关注周期检索近期就业、AI、资本及政策证据，并生成带来源的分析。</p><div class="career-report-tags"><span class="career-report-tag">地区：'+escapeHtml(region||"未指定")+'</span><span class="career-report-tag">职业：'+escapeHtml(role||"未指定")+'</span><span class="career-report-tag">周期：'+escapeHtml(horizon)+'</span>'+(context?'<span class="career-report-tag">补充：'+escapeHtml(context)+'</span>':'')+'</div></header><div class="career-live-status" id="career-report-content"><span class="career-live-spinner" aria-hidden="true"></span>正在联网检索就业、AI、资本和政策资料，并由 DeepSeek 汇总。通常需要几十秒；事实结论会附可点击来源。</div></main></div>';
  let loading=false;
  const sampleUrl=new URL(location.href);
  sampleUrl.search="";sampleUrl.searchParams.set("view","report");sampleUrl.searchParams.set("sample","1");sampleUrl.searchParams.set("language",reportLanguage);
  const sampleAction=()=>'<a class="button button-quiet" href="'+escapeHtml(sampleUrl.href)+'">'+pick("先看示例报告（非实时检索）","View sample report (not a live search)")+'</a>';
  function showStage(stage){
    const content=document.getElementById("career-report-content");
    if(!content)return;
    content.className="career-live-status cb-report-status";
    content.setAttribute("data-i18n-skip","");
    content.setAttribute("role","status");content.setAttribute("aria-live","polite");content.setAttribute("aria-busy","true");
    content.dataset.stage=stage.stage;
    const title=stage.stage==="generating"?pick("生成中：正在组织带来源的分析","Generating: composing the sourced analysis"):stage.stage==="searching"?pick("检索中：正在查找就业、AI、资本和政策资料","Searching: employment, AI, investment, and policy sources"):pick("正在连接报告服务","Connecting to the report service");
    const detail=stage.stage==="generating"?pick("已获取 "+stage.sourceCount+" 条可用来源。结论将在生成及校验完成后展示。","Retrieved "+stage.sourceCount+" usable sources. Conclusions appear after generation and validation."):pick("请保持页面打开。状态由服务端返回；不会在来源返回前显示结论。","Keep this page open. Stages are reported by the server; conclusions are not shown before sources return.");
    content.innerHTML='<span class="career-live-spinner" aria-hidden="true"></span><strong>'+escapeHtml(title)+'</strong><p>'+escapeHtml(detail)+'</p><div class="cb-start-actions">'+sampleAction()+'</div>';
  }
  const sourceUrl=value=>{try{const u=new URL(value);return u.protocol==="https:"?u.href:""}catch{return ""}};
  const citationText=(value,map)=>escapeHtml(value).replace(/\[S(\d{2})\]/g,(match,id)=>{const key="S"+id,source=map.get(key);return source?'<a class="career-live-citation" href="'+escapeHtml(source.url)+'" target="_blank" rel="noopener noreferrer" title="'+escapeHtml(source.title)+'">['+key+']</a>':'<span class="career-live-warning">[来源未登记]</span>'}).replace(/\n/g,"<br>");
  const renderList=(items,map)=>'<ul class="career-live-list">'+(Array.isArray(items)?items:[]).map(item=>'<li>'+citationText(typeof item==="string"?item:item.text||item.description||"",map)+'</li>').join("")+'</ul>';
  const renderSection=(label,title,text,map)=>'<section class="career-live-card"><div class="career-report-eyebrow">'+escapeHtml(label)+'</div><h2>'+escapeHtml(title)+'</h2><p>'+citationText(text,map)+'</p></section>';
  function render(data){
    const report=data.report||{},sources=(Array.isArray(data.sources)?data.sources:[]).filter(s=>s&&s.id&&sourceUrl(s.url));
    const sourceMap=new Map(sources.map(s=>[s.id,{...s,url:sourceUrl(s.url)}]));
    const scenarioCards=(Array.isArray(report.scenarios)?report.scenarios:[]).slice(0,3).map((item,index)=>'<article class="career-live-card"><div class="career-report-eyebrow">情景 '+(index+1)+'</div><h3>'+escapeHtml(item.name||"情景")+'</h3><p><strong>条件：</strong>'+citationText(item.conditions||"",sourceMap)+'</p><p style="margin-top:8px"><strong>岗位影响：</strong>'+citationText(item.impact||"",sourceMap)+'</p><p style="margin-top:8px"><strong>观察信号：</strong>'+citationText(item.indicators||"",sourceMap)+'</p></article>').join("");
    const sourceItems=sources.map(s=>'<article class="career-live-source"><a href="'+escapeHtml(sourceUrl(s.url))+'" target="_blank" rel="noopener noreferrer">['+escapeHtml(s.id)+'] '+escapeHtml(s.title||s.siteName||s.url)+' ↗</a><p>'+escapeHtml([s.siteName,s.publishedAt?'发布 '+s.publishedAt:'',s.authority!=null?'搜索权威等级 '+s.authority+'/4':'',s.topic||''].filter(Boolean).join(' · '))+'</p><p>'+escapeHtml(s.summary||s.snippet||"")+'</p></article>').join("");
    const generatedAt=data.meta&&data.meta.generatedAt?new Date(data.meta.generatedAt):new Date();
    const meta='<div class="career-live-meta"><span class="career-live-chip">DeepSeek '+escapeHtml(data.meta&&data.meta.model||"")+'</span><span class="career-live-chip">检索 '+escapeHtml(data.meta&&data.meta.searchCount||0)+' 个主题</span><span class="career-live-chip">来源 '+sources.length+' 条</span><span class="career-live-chip">生成 '+escapeHtml(generatedAt.toLocaleString())+'</span></div>';
    const coverage=(Array.isArray(data.meta&&data.meta.coverage)?data.meta.coverage:[]).map(x=>escapeHtml(x)).join("、");
    const gap=(Array.isArray(report.evidenceGaps)?report.evidenceGaps:[]).slice(0,8);
    const html='<header class="career-report-hero"><div class="career-report-eyebrow">CareerBridge AI · 实时检索完成</div><h1>'+escapeHtml(report.title||role+' 在 '+region+' 的职业趋势')+'</h1><p class="career-report-lead">'+escapeHtml(report.subtitle||'基于本次联网检索生成；来源覆盖不完整之处已单独标注。')+'</p><div class="career-report-tags"><span class="career-report-tag">地区：'+escapeHtml(region)+'</span><span class="career-report-tag">职业：'+escapeHtml(role)+'</span><span class="career-report-tag">周期：'+escapeHtml(horizon)+'</span>'+(context?'<span class="career-report-tag">场景：'+escapeHtml(context)+'</span>':'')+'</div>'+meta+'</header><div class="career-live-grid">'+renderSection('01 · 摘要','核心判断',report.summary||"",sourceMap)+renderSection('02 · 现状','地区就业与岗位现状',report.currentMarket||"",sourceMap)+renderSection('03 · AI','AI 发展与任务变化',report.aiImpact||"",sourceMap)+renderSection('04 · 资本','资本动向与行业传导',report.capitalImpact||"",sourceMap)+renderSection('05 · 政策','政府政策与监管影响',report.policyImpact||"",sourceMap)+renderSection('06 · 前景','岗位前景与主要不确定性',report.outlook||"",sourceMap)+'</div><section class="career-report-section"><div class="career-report-eyebrow">07 · SCENARIOS</div><h2>条件情景</h2><div class="career-live-scenario-grid">'+scenarioCards+'</div></section><div class="career-live-grid"><section class="career-live-card"><div class="career-report-eyebrow">08 · CAREER ACTIONS</div><h2>能力与行动建议</h2>'+renderList(report.careerActions,sourceMap)+'</section><section class="career-live-card"><div class="career-report-eyebrow">09 · WATCHLIST</div><h2>后续观察指标</h2>'+renderList(report.watchlist,sourceMap)+'</section></div>'+(gap.length?'<section class="career-live-warning"><strong>证据空白：</strong>'+renderList(gap,sourceMap)+'</section>':'')+'<section class="career-report-section"><div class="career-report-eyebrow">10 · SOURCES</div><h2>本次检索来源</h2><p class="career-report-lead">来源覆盖：'+(coverage||'以实际检索到的来源为准')+'。引用编号直接对应下列页面；搜索结果的权威等级是搜索服务提供的参考信号，不代表内容必然正确。</p><div class="career-live-source-list">'+(sourceItems||'<p>没有可展示的来源。</p>')+'</div></section><div class="career-live-warning">分析生成时间：'+escapeHtml(generatedAt.toLocaleString())+'。报告基于实时搜索结果，不保证覆盖所有招聘网站或尚未公开的信息。事实、分析判断和条件情景应结合来源及当地实际情况阅读。</div>';
    document.querySelector('.career-report-shell').innerHTML=html;
    if(isSampleReport){
      document.title=pick("示例报告 | CareerBridge AI","Sample report | CareerBridge AI");
      const shell=document.querySelector('.career-report-shell');
      const label=shell.querySelector('.career-report-eyebrow');label.setAttribute("data-i18n-skip","");label.textContent=pick("CareerBridge AI · 示例报告 · 非实时检索","CareerBridge AI · Sample report · Not a live search");
      const meta=shell.querySelector('.career-live-meta');meta.setAttribute("data-i18n-skip","");meta.textContent=pick("人工编写的教学示例 · 不调用 AI · 不包含实时招聘数据","Hand-authored educational sample · No AI request · No live hiring data");
      const note=shell.lastElementChild;note.setAttribute("data-i18n-skip","");note.textContent=pick("这是一份静态示例，不是本次联网检索或个人职业建议。来源仅用于说明阅读方法及全球背景，未核验当地最新就业、资本和政策资料。","This static sample is not a live search or personal career advice. Sources illustrate reading methods and global context; current local employment, investment, and policy data have not been verified.");
    }
  }
  async function loadReport(){
    const content=document.getElementById('career-report-content');
    if(loading)return;
    if(isSampleReport){render(window.CBSampleReport(reportLanguage));return;}
    loading=true;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),240000);
    showStage({stage:"connecting"});
    try{
      if(!role||!region)throw new Error('请返回输入页填写地区和职业后重新生成。');
      const aiStatusResponse=await fetch('/api/ai/status',{signal:controller.signal});
      const aiStatus=aiStatusResponse.ok?await aiStatusResponse.json():{};
      let owner={};
      if(aiStatus.reportProvider==='runpod'){
        const meResponse=await fetch('/api/me',{credentials:'same-origin',signal:controller.signal});
        const me=meResponse.ok?await meResponse.json():{};
        if(!me.user)throw new Error(reportLanguage==='zh'?'请先返回首页登录，再生成个人报告。':'Please sign in on the home page before generating a personal report.');
        owner={workspace:'user_owned',expectedAccountId:me.user.id};
      }
      const response=await fetch('/api/career-report',{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},signal:controller.signal,body:JSON.stringify({region,role,context,horizon,language:reportLanguage,...owner})});
      const data=await window.CBReportStream.consume(response,showStage);
      render(data);
    }catch(error){
      const raw=error&&error.message?error.message:"REPORT_UNAVAILABLE";
      const message=error.name==="AbortError"?pick("等待超时，请重试或先查看示例。","The request timed out. Retry or view the sample."):raw==="REPORT_INCOMPLETE"?pick("连接中断或报告不完整，请重试。","The connection ended or the report was incomplete. Please retry."):raw==="REPORT_UNAVAILABLE"?pick("报告服务暂不可用，请重试。","The report service is temporarily unavailable. Please retry."):window.CBLocale.t(raw);
      content.className='career-live-status cb-report-status career-live-error';
      content.setAttribute("data-i18n-skip","");content.setAttribute("role","alert");content.setAttribute("aria-busy","false");content.dataset.stage="error";
      content.innerHTML='<strong>'+pick("报告暂时无法生成","The report could not be generated")+'</strong><p>'+escapeHtml(message)+'</p><p>'+pick("重试会重新提交同一组输入。你也可以先看明确标注的静态示例；示例不会替代真实检索结果。","Retry submits the same inputs again. You can also preview the clearly labeled static sample; it never replaces real search results.")+'</p><div class="cb-start-actions"><button class="button button-primary" id="career-report-retry" type="button">'+pick("重试","Retry")+'</button>'+sampleAction()+'</div>';
      document.getElementById('career-report-retry').addEventListener('click',()=>loadReport());
    }finally{
      clearTimeout(timeout);loading=false;
    }
  }
  window.addEventListener('careerbridge:languagechange',event=>{
    reportLanguage=event.detail&&event.detail.language==="zh"?"zh":"en";
    const nextUrl=new URL(location.href);nextUrl.searchParams.set('language',reportLanguage);history.replaceState(null,'',nextUrl);
    document.title=reportLanguage==="en"?"Career Trends: "+(role||"Occupation")+" | CareerBridge AI":"未来趋势分析："+(role||"职业")+"｜CareerBridge AI";
    const content=document.getElementById('career-report-content');
    if(content){content.className='career-live-status';content.innerHTML='<span class="career-live-spinner" aria-hidden="true"></span>正在联网检索就业、AI、资本和政策资料，并由 DeepSeek 汇总。通常需要几十秒；事实结论会附可点击来源。';loadReport()}
  });
  const copyButton=document.getElementById('career-copy-link');
  if(copyButton)copyButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);copyButton.textContent='已复制链接'}catch{window.prompt(window.CBLocale.t('复制此报告链接：'),location.href)}});
  loadReport();
})();
</script>
