# Free preview deployment. The free Postgres database expires after 30 days.
services:
  - type: web
    name: codecatalyst-careerbridge-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: codecatalyst-careerbridge-ai-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_REQUESTS_PER_HOUR
        value: "10"
databases:
  - name: codecatalyst-careerbridge-ai-db
    plan: free
    databaseName: careerbridge
    user: careerbridge
